image: gitlab-registry.cern.ch/cms-phys-ciemat/test-corrections/custom-alma9:v0

setup:
  stage: run
  tags:
    - cvmfs
  variables:
    # This is also set on LXPLUS
    CMS_PATH: /cvmfs/cms.cern.ch
    CMT_CERN_USER: jleonhol
  script:
    # IMPORTANT: Expand aliases in noninteractive bash mode
    # Otherwise cmsrel and cmsenv won't work
    - shopt -s expand_aliases
    - yum install -y python3 openssl-devel wget which
    # access CVMFS
    - set +u && source ${CMS_PATH}/cmsset_default.sh; set -u
    - set +u && source setup.sh set -u
    - law index --verbose
    - cd docs
    - make html
  artifacts:
    paths:
      - docs/build/html/
    when: on_success
    expire_in: "2 hours"

pages:
  stage: pages
    only:
      - py3
      - main
      - master
  script:
    - mkdir -p public
    - cp -r docs/build/html/* public
  artifacts:
    paths:
      - public
    when: on_success
    expire_in: "2 hours"
